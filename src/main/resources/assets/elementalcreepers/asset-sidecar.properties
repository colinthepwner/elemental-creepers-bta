# Asset sidecar manifest.
#
# Maps a file inside a player-supplied copy of Elemental Creepers 1.4 onto the path this mod loads it
# from. This mod ships NONE of the original's art -- the sidecar only reads a copy the player already
# has on disk and writes the result into their generated texture pack. Nothing is downloaded.
#
#   <file name in the archive> = <path inside the generated pack>
#
# ⚠️ Keys are the BARE FILE NAME, lowercased -- not a path. The collector keys entries on
# `baseName(entry.getName())`, so the directory an image sits in inside the archive is ignored
# entirely. That is deliberate: it makes an unpacked folder, the original zip, and a modpack archive
# with the zip nested inside all work the same way. It also means a name here matches the first file
# with that name in the highest-ranked source, so keep the names specific.
#
# --- The whole list ------------------------------------------------------------------------------
# Eight files, and that is genuinely everything. Elemental Creepers registers no blocks and no items,
# and it defines no models -- all nine of its renderers construct `new il()`, which is b1.7.3's
# ModelCreeper. So the port binds BTA's own `geometry.creeper` and these eight skins are the entire
# art footprint of the mod. Every skin is 64x32, painted against that same box layout.
#
# The NINTH creeper, the ghost creeper, is deliberately absent: upstream points it at the vanilla
# /mob/creeper.png, so it keeps BTA's `minecraft:creeper` identifier and needs nothing supplied.
#
# The destination is `.../entity/<name>/0.png` and the trailing `/0.png` is required, not cosmetic:
# `Mob.setTextureIdentifier` builds `basePath = /assets/<ns>/textures/entity/<value>/` and then
# `defaultTexture = basePath + "0.png"`, so BTA looks for a numbered variant inside a directory named
# after the mob. A file written to `entity/firecreeper.png` is simply never read.

watercreeper.png    = assets/elementalcreepers/textures/entity/watercreeper/0.png
firecreeper.png     = assets/elementalcreepers/textures/entity/firecreeper/0.png
icecreeper.png      = assets/elementalcreepers/textures/entity/icecreeper/0.png
electriccreeper.png = assets/elementalcreepers/textures/entity/electriccreeper/0.png
earthcreeper.png    = assets/elementalcreepers/textures/entity/earthcreeper/0.png
psychiccreeper.png  = assets/elementalcreepers/textures/entity/psychiccreeper/0.png
cookiecreeper.png   = assets/elementalcreepers/textures/entity/cookiecreeper/0.png
magmacreeper.png    = assets/elementalcreepers/textures/entity/magmacreeper/0.png
